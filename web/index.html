<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Wedding invitation of Suleman Ahmad & Mehrunisa Zahid — 22, 24 & 25 October 2026.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#490A21">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Suleman's Wedding">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Suleman's Wedding Invitation</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Instant splash shown while the Flutter engine downloads. */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 28px;
      background: linear-gradient(#35061A, #490A21, #61102E);
      transition: opacity .5s ease;
    }
    #splash .ring {
      width: 66px; height: 66px; border-radius: 50%;
      border: 2px solid rgba(201, 162, 75, .85);
      display: flex; align-items: center; justify-content: center;
      animation: splash-pulse 2.4s ease-in-out infinite;
    }
    #splash .ring::after {
      content: ''; width: 10px; height: 10px; border-radius: 50%;
      background: #C9A24B;
    }
    #splash .dots { display: flex; gap: 10px; }
    #splash .dots i {
      width: 7px; height: 7px; border-radius: 50%;
      background: #C9A24B; opacity: .35;
      animation: splash-blink 1.4s infinite;
    }
    #splash .dots i:nth-child(2) { animation-delay: .2s; }
    #splash .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes splash-blink { 50% { opacity: 1; } }
    @keyframes splash-pulse { 50% { transform: scale(1.12); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="ring"></div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 550); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
